<script>
// [topic, source, context, question, options (FIRST = correct, shuffled at runtime)]
const Q=[
["5","P1 Q1","","A country at the end of the demographic transition usually has which of the following?",["Low birth and death rates","High birth and low death rates","A high infant mortality rate","A high crude birth rate","High population density"]],
["5","P1 Q2","","A country in the first stage of the demographic transition demonstrates which of the following?",["High birth rates, high death rates, and low rates of population growth","An old population age structure","High birth rates, but low death rates","Low birth rates, low death rates, and low rates of population growth","High birth rates, high death rates, and high rates of population growth"]],
["5","P1 Q12","Female/male life expectancy, % over 65: Germany 83/78, 21%; Italy 85/81, 22%; Japan 87/81, 28%.","Which describes the most likely population context for the countries listed?",["Stage five of the demographic transition model due to very low birth rates","High youth dependency ratio and a lack of economic resources to provide for large families","Rapid population growth in cities as people migrate from rural to urban areas for industrial jobs","Shortage of arable land on which to raise crops and other food products to support the population","Unstable food supply due to a rapidly growing population"]],
["5","P1 Q19","","Which of the following is a correct statement about the demographic transition model?",["It is characterized by relatively low growth rates at stage 1 and stage 4.","It is applicable only to eighteenth-century Europe.","It predicts the growth of population in Russia reasonably well.","It divides the demographic changes of a country into two stages of slow growth and high growth.","It supports the idea that technology can remove or extend the limits of food production."]],
["5","P1 Q21","DTM graph, stages 1–5.","Which country is best described as being at Stage 3 of the demographic transition model?",["Bolivia: birth rate = 24, death rate = 7","China: birth rate = 13, death rate = 7","Democratic Republic of the Congo: birth rate = 44, death rate = 10","Ivory Coast: birth rate = 37, death rate = 13","Hungary: birth rate = 10, death rate = 13"]],
["5","P1 Q25","Birth/death rates 2017 (per 1,000): Latin America 17/6; West Africa 39/11; Western Europe 10/10.","Deaths in Country A often occur due to outbreaks of epidemic disease, while in Country B most people die from chronic disorders such as heart disease. Where do they fall in the DTM and which region are they likely in?",["Country A: Stage 2, West Africa; Country B: Stage 4, western Europe","Country A: Stage 3, Latin America; Country B: Stage 2, West Africa","Country A: Stage 2, Latin America; Country B: Stage 3, West Africa","Country A: Stage 4, western Europe; Country B: Stage 2, West Africa","Country A: Stage 4, western Europe; Country B: Stage 2, Latin America"]],
["5","P1 Q27","","In the nineteenth and early twentieth century, the demographic transition in Europe was best characterized by",["urbanization and falling birth rates","a shift in the composition of national populations toward greater ethnic balance","a net population decline resulting from an excess of deaths over births","migration between European countries","large-scale population movements following periods of war or widespread civil unrest"]],
["5","P1 Q28","DTM graph, stages 1–4.","Which describes a characteristic of a country moving from stage 2 to stage 3 of the demographic transition model?",["Declining death rate","Shorter life expectancy","Increasing birth rate","High level of female education","Increasing dependence on farm labor"]],
["5","P1 Q29","DTM graph, stages 1–4.","Based on the DTM diagram, which correctly describes the expected population change over time?",["As birth rates are higher than death rates, population growth remains high.","As birth rates remain high and death rates decrease, the total population remains stable.","As birth and death rates are high, population growth remains high.","As birth and the death rates lower, the total population remains low.","As birth rates drop below death rates, the total population remains stable."]],
["5","P1 Q30","DTM graph, stages 1–5.","Which describes the most likely cause of death for a citizen of a country in stages 4 and 5 of the DTM?",["Degenerative diseases due to old age and lifestyle","Infectious diseases due to poor sanitation","Starvation due to an unstable food supply","Infectious diseases due to a lack of vaccines and antibiotics","Reemergence of previously eradicated diseases"]],
["5","P1 Q31","DTM graph, stages 1–4.","The low birth and death rates for a country in stage 4 of the DTM are best explained by",["the level of urbanization and technological advancement of a more developed country","the rural population and agricultural livelihood of a less developed country","the level of education and traditional roles for women in a less developed country","the resource-based economy and life expectancy of a less developed country","the environmental pollution and manufacturing infrastructure of a more developed country"]],
["5","P1 Q34","","Which best describes a strength of the epidemiological transition model (ETM)?",["The ETM explains the causes of changing death rates.","The ETM explains the causes of fertility decline.","The ETM explains differences in fertility rates between countries.","The ETM explains the role of migration in population change.","The ETM explains the distribution of health care services."]],
["5","P1 Q35","DTM graph, stages 1–5.","Which best describes how the epidemiologic transition affects the demographic transition?",["Improvements in nutrition, sanitation, and health care cause death rates to fall in stage 2 of the demographic transition.","The epidemiologic transition occurs in stage 1 of the demographic transition, causing a fluctuation in birth and death rates.","Improvements in nutrition, sanitation, and health care cause birth rates to fall in stage 3 of the demographic transition.","The epidemiologic transition occurs in stage 4 of the demographic transition, causing a slowing of the rate of natural increase.","The epidemiologic transition occurs in stage 5 of the demographic transition as famines and wars cause a total population decline."]],
["5","P1 Q36","DTM graph: birth rate, death rate, total population lines.","In the model shown, the lines for birth rate, death rate, and total population are indicators of a country’s",["level of social and economic development over time","cycles of economic boom and bust over time","demographic change following a period of warfare","demographic change following a period of famine","demographic change following a period of totalitarian government"]],
["5","P1 Q37","","The demographic transition is a general model that seeks to explain",["how differences in birth and death rates result in natural population change","the relationship between the size of age cohorts and natural population change","how variations in population size and food supply can lead to periods of crisis","the effects of changes in population size on the gross domestic product","variations in population size, population migration rates, and the rate of natural increase"]],
["5","P1 Q48","Birth rate 1990–95 → 2020–25 / death rate 1990–95 → 2020–25:\nI: 10.0→9.7 / 11.5→13.5\nII: 21.1→14.4 / 6.1→6.1\nIII: 43.3→24.9 / 14.2→8.2\nIV: 19.0→13.9 / 7.4→8.8\nV: 35.5→19.7 / 10.0→6.6","It can be inferred from global patterns of population growth that the country most likely to be in West Africa is",["Country III","Country I","Country II","Country IV","Country V"]],
["5","P1 Q49","","Which is most characteristic of societies currently in the last stage of demographic transition?",["Aging population","Hyperinflation","Unemployment","Youth dependency","Overpopulation"]],
["5","P1 Q55","Birth/death rates 2017 (per 1,000): South Asia 22/6; Eastern Europe 11/13; North America 14/7; East Asia 12/7; North Africa 28/6.","Based on the DTM, which region is best described as exhibiting overall negative rates of growth in stage 4?",["Eastern Europe","South Asia","North America","East Asia","Northern Africa"]],
["5","P2 Q14","","Which of the following processes best explains a decrease in mortality rates worldwide?",["Better hygiene and sanitation practices","Increased rates of female literacy","Increased rates of urbanization","Modern family planning methods","Greater female workforce participation"]],
["6","P1 Q39","","Which best explains why, in the late eighteenth and early nineteenth centuries, Thomas Malthus proposed his population theory?",["Malthus theorized that, if left unchecked by regular cycles of famine and misery, population would increase beyond the ability to feed itself.","Malthus theorized that the ability of a population to feed itself would increase with the expansion of the population; more people would mean greater knowledge invested in expanding food production.","Malthus theorized that reductions of infant mortality would eventually result in slower population growth rates.","Malthus theorized that agricultural developments in the mid-to-late eighteenth century would result in a significant expansion of food production, therefore alleviating the threat of overpopulation.","Malthus theorized the only way to prevent overpopulation would be to create policies that would limit the number of children a family could have."]],
["6","P1 Q42","","A country develops new technologies for farming, which help stabilize and increase food supply. According to Malthusian theory, which would best explain those results?",["The new technologies would reduce positive checks on population.","The new technologies would conserve water and energy supplies.","The new technologies would reduce preventive checks on population.","The new technologies would create a rapid decrease in population.","The new technologies would increase the need for preventative checks of population."]],
["6","P1 Q50","","In the early Industrial Revolution, Malthus theorized that population grows exponentially while food production grows only arithmetically. Which best explains how the Industrial Revolution reduced the threats he forecast?",["The resulting rural-to-urban migration for jobs in factories led to a decline in birth rates and lowered population growth rates below what Malthus predicted.","Industrialization led to the manufacture of weaponry used in warfare, resulting in higher mortality during the conflicts of the nineteenth and twentieth centuries that dramatically reduced populations.","The migration of people from rural areas to factory cities allowed farmers to expand their farm size and increase food production above Malthus’ predictions.","Industrialization enabled and promoted European imperialism, and Europeans migrated to overseas colonies, reducing the European population.","Mechanization expanded to agriculture, increasing the need for agricultural labor to run the equipment, leading rural families to have more children and increasing population growth."]],
["6","P1 Q51","","Malthusian theory would explain which possible consequence of high birth rates in a less developed country?",["Famine and starvation will occur as demand outpaces agricultural production.","Technological advancements will lead to increased agricultural production.","People will implement family-planning methods as resources grow scarce.","Areas with the greatest population density will import scarce resources.","Farmers will bring more land under cultivation to produce more food."]],
["6","P1 Q52","","In 1798 Malthus argued that populations grew exponentially while food supplies grew arithmetically, so food shortages would develop until famine and other checks slowed population growth. What correctly explains why his prediction did not come true in 1800s Europe?",["Urbanization resulted in smaller household sizes, and the mechanization of agriculture increased food production.","Immigration to Europe and the abolition of slavery resulted in a more productive agricultural labor force.","Rising education levels among women and increased numbers of single-person households reduced fertility and the demand for food.","Antinatalist population policies placed limits on the number of children per family and reduced the demand for food.","Global trade in manufactured food products increased the food supply and offset the demand for food."]],
["6","P1 Q56","","In which context could a neo-Malthusian perspective most successfully explain population characteristics?",["A country with a high rate of natural population increase, where food supplies are at risk","A country experiencing population decline, where birth rates are low","A country with a low rate of natural population increase, where a small percentage of citizens work in agriculture","A country experiencing significant out-migration, where economic conditions lead many job seekers to move to other countries","A country recovering from an environmental disaster, where infrastructure must be rebuilt"]],
["6","P1 Q57","","Neo-Malthusian theory can be used to explain which of the following situations?",["South Sudan experienced famine during the twenty-first century as a result of war and drought.","Brazil’s interior was previously unfit for farming, but recently more land is being cultivated.","Mexico has utilized new technology to shift from being a food importer to being a food exporter.","Malawi previously experienced famine but has improved agricultural yields through subsidies.","India has been able to increase agricultural yields by utilizing bio-engineered seeds."]],
["6","P1 Q74","","The Malthusian view of the world argues that",["famine in developing countries can be explained by examining their patterns of population growth","the contemporary problem of famine in developing countries is a result of the colonial legacy","the problem of population growth is a result of economic underdevelopment","one way to solve population growth in developing countries is to reduce their foreign debt","population growth is helpful to developing countries because it provides a larger rural workforce"]],
["7","P2 Q5","","In 1980 China implemented an antinatalist one-child policy. Which explains an unintended consequence of the policy?",["There are more men than women because of a cultural preference for male children.","There are more women than men because of a cultural preference for female children.","China’s total fertility rate dropped below the replacement rate due to strict enforcement of the law.","China’s age structure shifted toward a high youth dependency due to limiting births.","China discontinued the policy to accommodate an unexpected increase in infant mortality rates."]],
["7","P2 Q9","","Which explains an unintended consequence of China’s antinatalist one-child policy?",["A projected shortage of working-age people to care for the rising elderly population, resulting in an increase in the cost of living for older people.","A dramatic reduction of the birth rate and a decline of the rate of natural increase, resulting in lower population growth.","Agricultural families were forced to relocate to the nearest city to search for employment, resulting in increased urban population.","Decreased spending on childhood expenses, such as education and nursery supplies, results in a drop in domestic economic productivity.","A decreased emphasis on education due to the decreasing numbers of school-age children results in a loss of international competitiveness."]],
["7","P2 Q13","","Which country demographics would be used to explain the need for the pronatalist policies shown?",["A country with a birth rate of 11, a death rate of 13, and a rate of natural increase of −0.2, legislates tax credits for working parents","A country with a birth rate of 43, a death rate of 12, and a rate of natural increase of 3.1, passes a law that requires paid maternity leave","A country with a birth rate of 16, a death rate of 4, and a rate of natural increase of 1.2, establishes long maternity leave periods from work","A country with a birth rate of 12, a death rate of 10, and a rate of natural increase of 0.2, requires full-day kindergarten","A country with a birth rate of 20, a death rate of 10, and a rate of natural increase of 1.0, provides state-subsidized day care centers"]],
["7","P2 Q25","Many European countries provide families one or more of: tax credits, flexible parental leave, monthly payments, public-transportation fare reduction, free vaccines, and subsidized childcare.","Which would explain why a country such as Belgium would implement the described policies?",["Belgium has concerns about an aging population and wants to encourage higher birth rates.","Belgium has concerns about gender equality and wants to increase female participation in the workforce.","Belgium has concerns about a large youth population and wants to encourage lower birth rates.","Belgium has concerns about the ability of immigrants from developing regions to support themselves.","Belgium has concerns about an aging population and wants to encourage lower birth rates."]],
["7","P2 Q46","Japan: total pop 127.6M (2010) → 107.2M (2050); under 16: 17.5M → 11.7M; 65+: 29.1M → 42.9M. 2019 pyramid is narrow at the base.","What changes could local governments, businesses, and corporations make to reverse Japan’s national birth patterns?",["Adding low-cost or zero-cost infant daycare and preschool centers to make larger family sizes more affordable","Decreasing transportation costs to allow workers to commute from locations farther outside of densely populated urban centers","Reducing the length of maternity leave to incentivize women to return to paid employment","Enforcing a strict antinatalist policy that provides incentives for families to have fewer children","Increasing access to family planning clinics and making doctor’s office visits free for women patients"]],
["7","P2 Q49","","Country X has a high youth-dependency ratio. Country Z has fears of running out of agricultural resources. Which explains why both would implement antinatalist policies?",["Antinatalist policies promote family planning strategies to reduce fertility rates and discourage population growth.","Antinatalist policies promote higher birth rates so the country will have an adequate future workforce.","Antinatalist policies promote immigration so the country will be able to sustain its population.","Antinatalist policies correct skewed sex ratios so the number of each sex will be relatively even.","Antinatalist policies promote health and sanitation to lower the number of deaths from infectious diseases."]],
["7","P2 Q54","South Korea, as of 2018, has the lowest total fertility rate in the world at 1.1.","Which best explains a population policy South Korea could enact to promote higher birth rates?",["Decreasing the cost of childcare so that families can afford to have more children","Decreasing the age of retirement so that older Koreans can work in childcare centers","Increasing social-security benefits so that retirees can financially support their grandchildren","Decreasing health insurance so that parents pay more for the cost of childbirth","Increasing educational costs for universities so that the government can spend more on preschool"]],
["8","P1 Q33","","Since the 1970s changes in the social roles, lifestyles, and employment patterns of women in Europe, Canada, and the United States have affected the overall population through which of the following?",["Decreased total fertility rates","Increased total fertility rates","Increased death rates","Decreased death rates","Increased infant mortality rates"]],
["8","P1 Q72","","In many less developed countries, only a small percentage of school-aged youth attend school regularly, and in some cases fewer females than males are enrolled. Which pattern is a concern?",["A lack of qualified males and females to develop a workforce that will improve economic growth","A lack of jobs for older males because of the high number of qualified females","A large number of females working in factories because most males work in agriculture","A migration comprised entirely of working-age females to other countries for better-paying jobs","A migration of males and females to other countries to pursue postsecondary education"]],
["8","P2 Q8","Birth/death rates: France 12/9; Russia 13/13; Brazil 13/6; China 13/7; Mexico 20/5; India 21/7; Egypt 30/7; Nigeria 39/13.","Using the data, which most accurately describes the changing role of women in different parts of the world?",["The relatively low death rate for Mexico indicates that women may have increased access to health care.","The relatively high birth rate for Nigeria indicates that women may have increased access to contraception.","Similar death rates for China, India, and Egypt indicate that women in these countries have the same access to contraception.","Similar birth rates for Russia, Brazil, and China indicate that women in these countries may lack access to health care.","The relatively low birth rate for France indicates that women may lack access to health care."]],
["8","P2 Q11","RNI / GNI per capita / GII:\nMalawi 2.9 / $580 / 0.565\nOman 1.4 / $14,150 / 0.306\nCosta Rica 0.9 / $11,460 / 0.288\nNorway 0.4 / $78,250 / 0.045\nBulgaria −0.6 / $9,540 / 0.206","Which statement best compares the development indicators for the countries listed?",["Countries with higher GII scores have a higher RNI.","Countries with a lower GII score have a higher RNI.","Countries with a higher GNI per capita typically have a higher RNI.","Countries with a lower RNI have a higher GII score.","Countries with a lower GNI per capita have a lower RNI."]],
["8","P2 Q12","Same table as the previous question (RNI, GNI, GII).","The GII scores shown in the table are based on which types of data?",["Reproductive health, indices of empowerment, and labor-market participation","Gross domestic product, income distribution, and fertility rates","Gross national income per capita, years of schooling, and life expectancy","Percentage of people employed in the primary, secondary and tertiary sectors of the economy","Size of the informal economy, access to health care, and literacy rates"]],
["8","P2 Q45","Total fertility rate 1960/70/80/90/2000/10:\nCanada 3.81, 2.26, 1.74, 1.83, 1.49, 1.63\nUS 3.65, 2.48, 1.84, 2.08, 2.06, 1.93\nWomen with HS diploma or higher (%):\nCanada 34.0, 58.5, 64.9, 73.9, 85.1, 91.1\nUS 42.5, 52.8, 65.8, 74.8, 80.7, 87.6","Based on the data, which best describes the relationship between fertility and education in the United States and Canada?",["The increase in the percent of women who are more highly educated correlates with the decline in fertility.","The decrease in the percent of women who are more highly educated results in a larger number of children entering school.","The decrease in the percent of women who are more highly educated correlates with the decline in fertility.","The increase in the percent of women who are more highly educated correlates with the increase in fertility.","The increase in the percent of women who are more highly educated results in a larger number of children entering school."]],
["8","P2 Q58","Birth rate / death rate / total fertility rate, 2018:\nCore 10 / 10 / 1.6\nSemiperiphery 21 / 7 / 2.6\nPeriphery 33 / 8 / 4.2","Based on the data, which accurately describes changes in the roles of women as countries develop economically?",["More women work in professional jobs","More women work in agriculture","More women leave the workforce","Fewer women enroll in secondary school","Most women work in the home"]]
